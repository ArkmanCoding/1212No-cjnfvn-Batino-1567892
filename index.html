<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#F5F8FF" />
  <title>نوبتینو | انتخاب نقش</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playpen+Sans+Arabic:wght@100..800&display=swap" rel="stylesheet">
 
<link rel="stylesheet" href="./css/style.css">


  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4" defer></script>
</head>

<body>
  <main class="page">

    <!-- ============ HEADER ============ -->
    <header class="header">
      <!-- <div class="app-icon"> -->
        <img src="./img/fav4.png" class="logo" alt="">
      <!-- </div> -->

      <h1>شما در نوبتینو چه نقشی دارید؟</h1>
      <p>لطفاً نقش خود را برای ادامه انتخاب کنید</p>
    </header>

    <!-- ============ ROLE CARDS ============ -->
    <section class="roles" aria-label="انتخاب نقش کاربری">

      <!-- Card 1 : Buyer -->
      <article class="role-card">
        <div class="role-content">
          <div class="role-text">
            <h2>من خریدار هستم</h2>
            <p>می‌خواهم نان مورد نظرم را رزرو یا سفارش دهم.</p>
          </div>

          <div class="role-illustration">
            <img src="./img/kharydar.png" alt="" aria-hidden="true" loading="eager" decoding="async" />
          </div>
        </div>

        <div class="role-action">
          <a  href="../Home/index.html"  onclick="return delayRedirect(event, this);"> <!-- ادرس همون صفحه مدیریتی و ثبت نام مشتری -->
          <span class="arrow-btn" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
              stroke-linejoin="round">
              <path
                d="M23 12H515H510H515H513H515H510H515H512H515H510H515H513H515H510H515H512H515H510H515H513H515H510H515H5"
                ّ />
              <path d="m12 19-7-7 7-7" />
            </svg>
          </span>
          </a>
        </div>
      </article>

      <!-- Card 2 : Baker -->
      <article class="role-card">
        <div class="role-content">
          <div class="role-text">
            <h2>من نانوایی هستم</h2>
            <p>می‌خواهم نانوایی خود را در نوبتینو ثبت و مدیریت کنم.</p>
          </div>

          <div class="role-illustration">
            <img src="./img/nanvA.png" style="
    bottom: 4px !important;
    top: -24px;
    right: -10px;
    width: 120%;
" alt="" aria-hidden="true" loading="eager" decoding="async" />
          </div>
        </div>

        <div class="role-action">
          <a  href="../foroshande/nanva/index.html"  onclick="return delayRedirect(event, this);"> <!-- ادرس همون صفحه مدیریتی و ثبت نام نانوا -->
          <span class="arrow-btn" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
              stroke-linejoin="round">
              <path
                d="M23 12H515H510H515H513H515H510H515H512H515H510H515H513H515H510H515H512H515H510H515H513H515H510H515H5"
                ّ />
              <path d="m12 19-7-7 7-7" />
            </svg>
          </span>
        </a>
        </div>
      </article>

    </section>

    <!-- ============ FOOTER ============ -->
    <footer class="footer">
      <p class="footer-login">
        قبلاً ثبت‌نام کرده‌اید؟
        <a href="#" aria-label="ورود به حساب کاربری">ورود</a>
      </p>

      <nav class="footer-links" aria-label="پیوندهای پانوشت">
        <a href="#" aria-label="راهنمای استفاده از نوبتینو">راهنما</a>
        <span class="sep" aria-hidden="true">·</span>
        <a href="#" aria-label="پشتیبانی نوبتینو">پشتیبانی</a>
        <span class="sep" aria-hidden="true">·</span>
        <a href="#" aria-label="درباره ما">درباره ما</a>
      </nav>
    </footer>

  </main>

  <script>
    
  function delayRedirect(event, element) {
    event.preventDefault(); // جلوگیری از رفتن فوری
    const url = element.getAttribute('href');
    if (!url || url === '') return false;

    // افکت بصری (اختیاری - مثلاً کم‌رنگ شدن)
    // element.style.opacity = '0.6';
    // element.style.pointerEvents = 'none';

    setTimeout(() => {
      window.location.href = url;
    }, 500); // ۱۰۰۰ میلی‌ثانیه = ۱ ثانیه

    return false;
  }
  </script>
</body>

</html>
