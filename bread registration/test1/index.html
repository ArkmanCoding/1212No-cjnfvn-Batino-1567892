<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نوبینو | رزرو نان</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap');

        :root {
            --bg-milky: #F9F8F4;
            --blue-accent: #7BAEC8;
            --blue-deep: #5A8FAD;
            --blue-glow: #A8D3EB;
            --charcoal: #1C1C1C;
            --charcoal-soft: #3A3A3A;
            --charcoal-muted: #6B6B6B;
            --white-pure: #FFFFFF;
            --green-start: #43A047;
            --blue-end: #42A5F5;
            --success-green: #4CAF50;
            --card-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            --card-shadow-hover: 0 6px 24px rgba(0, 0, 0, 0.10);
            --radius-lg: 20px;
            --radius-md: 14px;
            --radius-sm: 10px;
            --radius-xs: 8px;
            --transition-smooth: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-bounce: 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            --transition-spring: 0.5s cubic-bezier(0.22, 0.99, 0.35, 1.17);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Vazirmatn', 'Tahoma', system-ui, sans-serif;
            background: #EEECE6;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .app-shell {
            width: 100%;
            max-width: 460px;
            height: 88vh;
            max-height: 820px;
            min-height: 640px;
            background: var(--bg-milky);
            border-radius: 28px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.12), 0 4px 16px rgba(0, 0, 0, 0.06);
        }

        @media (max-width: 500px) {
            body {
                padding: 0;
                align-items: stretch;
            }
            .app-shell {
                max-width: 100%;
                height: 100vh;
                max-height: 100vh;
                min-height: 100vh;
                border-radius: 0;
                box-shadow: none;
            }
        }

        .header {
            position: sticky;
            top: 0;
            z-index: 20;
            background: var(--bg-milky);
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 14px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            flex-shrink: 0;
        }

        .back-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: none;
            background: var(--white-pure);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all var(--transition-smooth);
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
            flex-shrink: 0;
            -webkit-tap-highlight-color: transparent;
        }
        .back-btn:active {
            transform: scale(0.93);
            background: #f0f0ed;
        }
        .back-btn svg {
            width: 20px;
            height: 20px;
            color: var(--charcoal);
        }

        .header-title {
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--charcoal);
            letter-spacing: -0.01em;
        }

        .content {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 8px 20px 20px;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }
        .content::-webkit-scrollbar {
            width: 0;
            height: 0;
        }

        .section-label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--charcoal-muted);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin: 18px 0 10px 0;
            padding-right: 4px;
        }

        .bread-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .bread-card {
            display: flex;
            align-items: center;
            gap: 14px;
            background: var(--white-pure);
            border-radius: var(--radius-md);
            padding: 14px 16px;
            box-shadow: var(--card-shadow);
            transition: all var(--transition-smooth);
            cursor: default;
            border: 2px solid transparent;
            position: relative;
            overflow: hidden;
        }
        .bread-card:active {
            transform: scale(0.985);
        }
        .bread-card.quantity-active {
            border-color: var(--blue-accent);
            box-shadow: 0 0 0 4px rgba(123, 174, 200, 0.13);
        }

        .bread-icon-wrap {
            width: 52px;
            height: 52px;
            border-radius: var(--radius-sm);
            background: #FDF6EC;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            position: relative;
        }
        .bread-icon-wrap svg {
            width: 38px;
            height: 38px;
        }

        .bread-info {
            flex: 1;
            min-width: 0;
        }
        .bread-name {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--charcoal);
            margin-bottom: 2px;
        }
        .bread-price {
            font-size: 0.78rem;
            font-weight: 500;
            color: var(--charcoal-muted);
        }

        .stepper {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }
        .stepper-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 2px solid #E0DED8;
            background: var(--white-pure);
            cursor: pointer;
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--charcoal);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition-smooth);
            line-height: 1;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .stepper-btn:active {
            transform: scale(0.88);
            background: #f5f4f0;
        }
        .stepper-btn.decrement {
            color: #B0AD9F;
        }
        .stepper-btn.decrement.has-value {
            color: var(--charcoal);
            border-color: #C8C5BB;
        }
        .stepper-btn.increment {
            border-color: var(--blue-accent);
            color: var(--blue-deep);
        }
        .stepper-value {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--charcoal);
            min-width: 24px;
            text-align: center;
            transition: all var(--transition-bounce);
            display: inline-block;
        }
        .stepper-value.pop {
            animation: popNumber 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes popNumber {
            0% {
                transform: scale(1);
            }
            40% {
                transform: scale(1.45);
                color: var(--blue-deep);
            }
            100% {
                transform: scale(1);
            }
        }

        .time-selector-wrap {
            position: relative;
            margin-top: 4px;
        }
        .time-scroll {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 6px 4px 14px;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
            scroll-behavior: smooth;
            cursor: grab;
            user-select: none;
        }
        .time-scroll::-webkit-scrollbar {
            height: 0;
        }
        .time-scroll:active {
            cursor: grabbing;
        }
        .time-scroll-fade-right,
        .time-scroll-fade-left {
            position: absolute;
            top: 0;
            bottom: 10px;
            width: 36px;
            pointer-events: none;
            z-index: 2;
            transition: opacity 0.3s;
        }
        .time-scroll-fade-right {
            right: -2px;
            background: linear-gradient(to left, var(--bg-milky) 30%, transparent 100%);
        }
        .time-scroll-fade-left {
            left: -2px;
            background: linear-gradient(to right, var(--bg-milky) 30%, transparent 100%);
            opacity: 0;
        }
        .time-scroll-fade-left.visible {
            opacity: 1;
        }

        .time-slot {
            flex-shrink: 0;
            scroll-snap-align: center;
            min-width: 88px;
            padding: 14px 16px;
            border-radius: var(--radius-md);
            background: var(--white-pure);
            border: 2px solid transparent;
            text-align: center;
            cursor: pointer;
            transition: all var(--transition-smooth);
            box-shadow: var(--card-shadow);
            position: relative;
            -webkit-tap-highlight-color: transparent;
        }
        .time-slot:active {
            transform: scale(0.95);
        }
        .time-slot .time-main {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--charcoal);
            transition: color var(--transition-smooth);
        }
        .time-slot .time-sub {
            font-size: 0.7rem;
            font-weight: 500;
            color: var(--charcoal-muted);
            margin-top: 2px;
            transition: color var(--transition-smooth);
        }
        .time-slot.selected {
            background: var(--blue-accent);
            border-color: var(--blue-deep);
            box-shadow: 0 0 0 8px rgba(123, 174, 200, 0.18), 0 8px 28px rgba(90, 143, 173, 0.22);
            transform: translateY(-2px);
            animation: selectGlow 0.5s cubic-bezier(0.22, 0.99, 0.35, 1.17);
        }
        .time-slot.selected .time-main,
        .time-slot.selected .time-sub {
            color: #FFFFFF;
        }
        .time-slot .badge-suggestion {
            position: absolute;
            top: -8px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.62rem;
            font-weight: 700;
            background: #FFF;
            color: var(--blue-deep);
            padding: 3px 10px;
            border-radius: 20px;
            white-space: nowrap;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            letter-spacing: 0.02em;
        }
        .time-slot.selected .badge-suggestion {
            background: #FFFFFF;
            color: var(--blue-deep);
        }

        @keyframes selectGlow {
            0% {
                box-shadow: 0 0 0 0px rgba(123, 174, 200, 0), 0 2px 8px rgba(0, 0, 0, 0.04);
                transform: translateY(0);
            }
            50% {
                box-shadow: 0 0 0 16px rgba(123, 174, 200, 0.08), 0 10px 32px rgba(90, 143, 173, 0.28);
                transform: translateY(-3px);
            }
            100% {
                box-shadow: 0 0 0 8px rgba(123, 174, 200, 0.18), 0 8px 28px rgba(90, 143, 173, 0.22);
                transform: translateY(-2px);
            }
        }

        .queue-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--white-pure);
            border-radius: var(--radius-md);
            padding: 14px 18px;
            margin-top: 16px;
            box-shadow: var(--card-shadow);
            transition: all var(--transition-smooth);
        }
        .live-dot-wrap {
            position: relative;
            width: 20px;
            height: 20px;
            flex-shrink: 0;
        }
        .live-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #4CAF50;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: livePulse 2s ease-in-out infinite;
        }
        .live-dot-ring {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 2px solid rgba(76, 175, 80, 0.3);
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: liveRing 2s ease-in-out infinite;
        }
        @keyframes livePulse {
            0%,
            100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
            50% {
                transform: translate(-50%, -50%) scale(1.6);
                opacity: 0.5;
            }
        }
        @keyframes liveRing {
            0%,
            100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0.6;
            }
            50% {
                transform: translate(-50%, -50%) scale(1.8);
                opacity: 0;
            }
        }
        .queue-text {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--charcoal-soft);
        }
        .queue-text strong {
            font-weight: 700;
            color: var(--charcoal);
        }

        .footer {
            position: sticky;
            bottom: 0;
            z-index: 20;
            background: var(--bg-milky);
            padding: 12px 20px 18px;
            border-top: 1px solid rgba(0, 0, 0, 0.05);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .total-wrap {
            flex-shrink: 0;
        }
        .total-label {
            font-size: 0.68rem;
            font-weight: 500;
            color: var(--charcoal-muted);
            letter-spacing: 0.02em;
        }
        .total-price {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--charcoal);
            transition: all var(--transition-bounce);
            display: inline-block;
        }
        .total-price.bump {
            animation: priceBump 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes priceBump {
            0% {
                transform: scale(1);
            }
            40% {
                transform: scale(1.2);
                color: var(--blue-deep);
            }
            100% {
                transform: scale(1);
            }
        }

        .confirm-btn {
            flex: 1;
            padding: 15px 20px;
            border-radius: var(--radius-md);
            border: none;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 700;
            color: #FFFFFF;
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, #43A047 0%, #42A5F5 100%);
            background-size: 200% 200%;
            transition: all var(--transition-smooth);
            box-shadow: 0 6px 20px rgba(67, 160, 71, 0.3);
            -webkit-tap-highlight-color: transparent;
            letter-spacing: 0.01em;
            white-space: nowrap;
        }
        .confirm-btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 60%;
            height: 100%;
            background: linear-gradient(90deg,
                    transparent 0%,
                    rgba(255, 255, 255, 0.25) 30%,
                    rgba(255, 255, 255, 0.45) 50%,
                    rgba(255, 255, 255, 0.25) 70%,
                    transparent 100%);
            animation: shimmer 2.4s ease-in-out infinite;
            z-index: 1;
        }
        @keyframes shimmer {
            0% {
                left: -100%;
            }
            100% {
                left: 160%;
            }
        }
        .confirm-btn:active {
            transform: scale(0.96);
            box-shadow: 0 3px 10px rgba(67, 160, 71, 0.25);
        }
        .confirm-btn .btn-content {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all var(--transition-smooth);
        }
        .confirm-btn.success-state {
            background: var(--success-green);
            background-size: 100% 100%;
            box-shadow: 0 6px 24px rgba(76, 175, 80, 0.4);
            pointer-events: none;
            animation: successPulse 0.6s cubic-bezier(0.22, 0.99, 0.35, 1.17);
        }
        .confirm-btn.success-state::after {
            animation: none;
            opacity: 0;
        }
        .confirm-btn.success-state .btn-text {
            opacity: 0;
            transform: translateY(10px);
        }
        .confirm-btn .checkmark-svg {
            position: absolute;
            z-index: 3;
            opacity: 0;
            transform: scale(0) rotate(-45deg);
            transition: all 0.45s cubic-bezier(0.22, 0.99, 0.35, 1.17);
            width: 28px;
            height: 28px;
        }
        .confirm-btn.success-state .checkmark-svg {
            opacity: 1;
            transform: scale(1) rotate(0deg);
        }
        @keyframes successPulse {
            0% {
                transform: scale(1);
            }
            30% {
                transform: scale(1.04);
            }
            60% {
                transform: scale(0.97);
            }
            100% {
                transform: scale(1);
            }
        }

        @media (min-width: 501px) {
            .time-slot {
                min-width: 80px;
                padding: 12px 14px;
            }
            .time-slot .time-main {
                font-size: 1rem;
            }
            .bread-card {
                padding: 12px 14px;
            }
        }
    </style>
</head>
<body>
    <div class="app-shell">
        <header class="header">
            <button class="back-btn" aria-label="بازگشت">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="14 6 8 12 14 18"></polyline>
                </svg>
            </button>
            <span class="header-title">رزرو نان</span>
        </header>

        <main class="content" id="mainContent">
            <p class="section-label">انتخاب نان</p>
            <div class="bread-grid" id="breadGrid">
                <div class="bread-card" data-bread="sangak" data-price="15000">
                    <div class="bread-icon-wrap">
                        <svg viewBox="0 0 56 56" fill="none">
                            <ellipse cx="28" cy="28" rx="24" ry="9" fill="#E8C99B" stroke="#C4956A" stroke-width="1.8" />
                            <ellipse cx="28" cy="26" rx="22" ry="7.5" fill="#F5DDB8" />
                            <circle cx="18" cy="24" r="1.2" fill="#C4956A" opacity="0.6" />
                            <circle cx="24" cy="27" r="1" fill="#C4956A" opacity="0.5" />
                            <circle cx="30" cy="23" r="1.3" fill="#C4956A" opacity="0.6" />
                            <circle cx="36" cy="26" r="0.9" fill="#C4956A" opacity="0.5" />
                            <circle cx="21" cy="30" r="0.8" fill="#C4956A" opacity="0.4" />
                            <circle cx="33" cy="29" r="1.1" fill="#C4956A" opacity="0.5" />
                        </svg>
                    </div>
                    <div class="bread-info">
                        <div class="bread-name">سنگک</div>
                        <div class="bread-price">۱۵,۰۰۰ تومان</div>
                    </div>
                    <div class="stepper">
                        <button class="stepper-btn decrement" aria-label="کاهش تعداد">−</button>
                        <span class="stepper-value" data-bread="sangak">۰</span>
                        <button class="stepper-btn increment" aria-label="افزایش تعداد">+</button>
                    </div>
                </div>

                <div class="bread-card" data-bread="barbari" data-price="12000">
                    <div class="bread-icon-wrap">
                        <svg viewBox="0 0 56 56" fill="none">
                            <ellipse cx="28" cy="28" rx="20" ry="11" fill="#E0BF8A" stroke="#B8895A" stroke-width="1.8" />
                            <ellipse cx="28" cy="26" rx="18" ry="9.5" fill="#F0D5A8" />
                            <line x1="15" y1="24" x2="15" y2="32" stroke="#C4956A" stroke-width="1.2" opacity="0.5" />
                            <line x1="22" y1="22" x2="22" y2="34" stroke="#C4956A" stroke-width="1.2" opacity="0.5" />
                            <line x1="28" y1="21" x2="28" y2="35" stroke="#C4956A" stroke-width="1.2" opacity="0.5" />
                            <line x1="34" y1="22" x2="34" y2="34" stroke="#C4956A" stroke-width="1.2" opacity="0.5" />
                            <line x1="41" y1="24" x2="41" y2="32" stroke="#C4956A" stroke-width="1.2" opacity="0.5" />
                        </svg>
                    </div>
                    <div class="bread-info">
                        <div class="bread-name">بربری</div>
                        <div class="bread-price">۱۲,۰۰۰ تومان</div>
                    </div>
                    <div class="stepper">
                        <button class="stepper-btn decrement" aria-label="کاهش تعداد">−</button>
                        <span class="stepper-value" data-bread="barbari">۰</span>
                        <button class="stepper-btn increment" aria-label="افزایش تعداد">+</button>
                    </div>
                </div>

                <div class="bread-card" data-bread="taftoon" data-price="8000">
                    <div class="bread-icon-wrap">
                        <svg viewBox="0 0 56 56" fill="none">
                            <circle cx="28" cy="28" r="14" fill="#EDD4A2" stroke="#C49A6C" stroke-width="1.8" />
                            <circle cx="28" cy="26" r="11" fill="#F7E6C4" />
                            <circle cx="28" cy="24" r="4" fill="#FDF3E0" opacity="0.7" />
                            <circle cx="25" cy="22" r="1.5" fill="#D4A574" opacity="0.35" />
                            <circle cx="31" cy="22" r="1.5" fill="#D4A574" opacity="0.35" />
                            <circle cx="28" cy="19" r="1.2" fill="#D4A574" opacity="0.3" />
                        </svg>
                    </div>
                    <div class="bread-info">
                        <div class="bread-name">تافتون</div>
                        <div class="bread-price">۸,۰۰۰ تومان</div>
                    </div>
                    <div class="stepper">
                        <button class="stepper-btn decrement" aria-label="کاهش تعداد">−</button>
                        <span class="stepper-value" data-bread="taftoon">۰</span>
                        <button class="stepper-btn increment" aria-label="افزایش تعداد">+</button>
                    </div>
                </div>

                <div class="bread-card" data-bread="lavash" data-price="5000">
                    <div class="bread-icon-wrap">
                        <svg viewBox="0 0 56 56" fill="none">
                            <rect x="6" y="20" width="44" height="14" rx="7" fill="#F2DBB5" stroke="#C49A6C"
                            stroke-width="1.8" />
                            <rect x="8" y="22" width="40" height="10" rx="5" fill="#FBF0DD" />
                            <ellipse cx="28" cy="27" rx="14" ry="3" fill="#E8CFA4" opacity="0.35" />
                        </svg>
                    </div>
                    <div class="bread-info">
                        <div class="bread-name">لواش</div>
                        <div class="bread-price">۵,۰۰۰ تومان</div>
                    </div>
                    <div class="stepper">
                        <button class="stepper-btn decrement" aria-label="کاهش تعداد">−</button>
                        <span class="stepper-value" data-bread="lavash">۰</span>
                        <button class="stepper-btn increment" aria-label="افزایش تعداد">+</button>
                    </div>
                </div>
            </div>

            <p class="section-label">انتخاب زمان تحویل</p>
            <div class="time-selector-wrap" id="timeSelectorWrap">
                <div class="time-scroll-fade-right"></div>
                <div class="time-scroll-fade-left" id="fadeLeft"></div>
                <div class="time-scroll" id="timeScroll">
                    <div class="time-slot" data-time="07:00">
                        <div class="time-main">۷:۰۰</div>
                        <div class="time-sub">صبح</div>
                    </div>
                    <div class="time-slot" data-time="07:30">
                        <div class="time-main">۷:۳۰</div>
                        <div class="time-sub">صبح</div>
                        <span class="badge-suggestion">زودترین</span>
                    </div>
                    <div class="time-slot" data-time="08:00">
                        <div class="time-main">۸:۰۰</div>
                        <div class="time-sub">صبح</div>
                    </div>
                    <div class="time-slot" data-time="08:30">
                        <div class="time-main">۸:۳۰</div>
                        <div class="time-sub">صبح</div>
                        <span class="badge-suggestion">پیشنهاد</span>
                    </div>
                    <div class="time-slot" data-time="09:00">
                        <div class="time-main">۹:۰۰</div>
                        <div class="time-sub">صبح</div>
                    </div>
                    <div class="time-slot" data-time="09:30">
                        <div class="time-main">۹:۳۰</div>
                        <div class="time-sub">صبح</div>
                    </div>
                    <div class="time-slot" data-time="10:00">
                        <div class="time-main">۱۰:۰۰</div>
                        <div class="time-sub">صبح</div>
                    </div>
                    <div class="time-slot" data-time="10:30">
                        <div class="time-main">۱۰:۳۰</div>
                        <div class="time-sub">صبح</div>
                    </div>
                    <div class="time-slot" data-time="11:00">
                        <div class="time-main">۱۱:۰۰</div>
                        <div class="time-sub">صبح</div>
                    </div>
                </div>
            </div>

            <div class="queue-indicator" id="queueIndicator">
                <div class="live-dot-wrap">
                    <div class="live-dot"></div>
                    <div class="live-dot-ring"></div>
                </div>
                <span class="queue-text">وضعیت صف: <strong id="queueCount">۴</strong> نفر در صف منتظرند</span>
            </div>
        </main>

        <footer class="footer">
            <div class="total-wrap">
                <div class="total-label">مجموع</div>
                <div class="total-price" id="totalPrice">۰ تومان</div>
            </div>
            <button class="confirm-btn" id="confirmBtn">
                <span class="btn-content">
                    <span class="btn-text">تأیید و رزرو نوبت</span>
                </span>
                <svg class="checkmark-svg" viewBox="0 0 28 28" fill="none">
                    <circle cx="14" cy="14" r="13" stroke="white" stroke-width="2.5" fill="none" />
                    <polyline points="8,14 12,18 20,10" stroke="white" stroke-width="2.8" stroke-linecap="round"
                    stroke-linejoin="round" fill="none" />
                </svg>
            </button>
        </footer>
    </div>

    <script>
        (function() {
            const breadGrid = document.getElementById('breadGrid');
            const totalPriceEl = document.getElementById('totalPrice');
            const confirmBtn = document.getElementById('confirmBtn');
            const timeScroll = document.getElementById('timeScroll');
            const fadeLeft = document.getElementById('fadeLeft');
            const queueCountEl = document.getElementById('queueCount');
            const breadCards = breadGrid.querySelectorAll('.bread-card');

            let quantities = {};
            let selectedTimeSlot = null;
            let totalAmount = 0;

            breadCards.forEach(card => {
                const breadType = card.dataset.bread;
                quantities[breadType] = 0;
            });

            function toPersianNum(num) {
                const persianDigits = ['۰', '۱', '۲', '۳', '۴', '۵', '۶', '۷', '۸', '۹'];
                return String(num).replace(/\d/g, d => persianDigits[parseInt(d)]);
            }

            function formatPrice(amount) {
                if (amount === 0) return '۰ تومان';
                const formatted = amount.toLocaleString('en-US').replace(/,/g, ',');
                let persianFormatted = '';
                for (const ch of formatted) {
                    if (ch === ',') {
                        persianFormatted += '،';
                    } else if (/\d/.test(ch)) {
                        persianFormatted += toPersianNum(parseInt(ch));
                    } else {
                        persianFormatted += ch;
                    }
                }
                return persianFormatted + ' تومان';
            }

            function updateTotal() {
                totalAmount = 0;
                breadCards.forEach(card => {
                    const breadType = card.dataset.bread;
                    const price = parseInt(card.dataset.price);
                    totalAmount += quantities[breadType] * price;
                });
                totalPriceEl.textContent = formatPrice(totalAmount);
                totalPriceEl.classList.remove('bump');
                void totalPriceEl.offsetWidth;
                totalPriceEl.classList.add('bump');
            }

            function updateCardState(card) {
                const breadType = card.dataset.bread;
                const qty = quantities[breadType];
                const valueEl = card.querySelector('.stepper-value');
                const decBtn = card.querySelector('.decrement');

                valueEl.textContent = toPersianNum(qty);
                valueEl.classList.remove('pop');
                void valueEl.offsetWidth;
                valueEl.classList.add('pop');

                if (qty > 0) {
                    card.classList.add('quantity-active');
                    decBtn.classList.add('has-value');
                } else {
                    card.classList.remove('quantity-active');
                    decBtn.classList.remove('has-value');
                }
            }

            breadGrid.addEventListener('click', function(e) {
                const incrementBtn = e.target.closest('.increment');
                const decrementBtn = e.target.closest('.decrement');

                if (!incrementBtn && !decrementBtn) return;

                const card = (incrementBtn || decrementBtn).closest('.bread-card');
                const breadType = card.dataset.bread;
                const valueEl = card.querySelector('.stepper-value');

                if (incrementBtn) {
                    if (quantities[breadType] < 10) {
                        quantities[breadType]++;
                        updateCardState(card);
                        updateTotal();
                    }
                }

                if (decrementBtn) {
                    if (quantities[breadType] > 0) {
                        quantities[breadType]--;
                        updateCardState(card);
                        updateTotal();
                    }
                }
            });

            timeScroll.addEventListener('click', function(e) {
                const slot = e.target.closest('.time-slot');
                if (!slot) return;

                if (selectedTimeSlot === slot) return;

                const allSlots = timeScroll.querySelectorAll('.time-slot');
                allSlots.forEach(s => s.classList.remove('selected'));

                slot.classList.add('selected');
                selectedTimeSlot = slot;

                slot.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            });

            const defaultSlot = timeScroll.querySelector('.time-slot[data-time="08:30"]');
            if (defaultSlot) {
                defaultSlot.classList.add('selected');
                selectedTimeSlot = defaultSlot;
                setTimeout(() => {
                    defaultSlot.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                }, 400);
            }

            timeScroll.addEventListener('scroll', function() {
                const scrollLeft = timeScroll.scrollLeft;
                if (scrollLeft > 20) {
                    fadeLeft.classList.add('visible');
                } else {
                    fadeLeft.classList.remove('visible');
                }
            });

            let touchStartX = 0;
            timeScroll.addEventListener('touchstart', function(e) {
                touchStartX = e.touches[0].clientX;
            }, { passive: true });

            function simulateQueueUpdate() {
                const newCount = Math.floor(Math.random() * 7) + 2;
                queueCountEl.textContent = toPersianNum(newCount);
                const indicator = document.getElementById('queueIndicator');
                indicator.style.transform = 'scale(1.02)';
                setTimeout(() => {
                    indicator.style.transform = 'scale(1)';
                }, 300);
            }

            setInterval(simulateQueueUpdate, 18000 + Math.random() * 20000);

            confirmBtn.addEventListener('click', function() {
                if (confirmBtn.classList.contains('success-state')) return;

                const totalQty = Object.values(quantities).reduce((a, b) => a + b, 0);
                if (totalQty === 0 && !selectedTimeSlot) return;

                confirmBtn.classList.add('success-state');

                setTimeout(() => {
                    confirmBtn.classList.remove('success-state');
                }, 2400);
            });

            updateTotal();

            document.querySelector('.back-btn').addEventListener('click', function() {
                this.style.transform = 'scale(0.9)';
                setTimeout(() => {
                    this.style.transform = 'scale(1)';
                }, 200);
            });
        })();
    </script>
</body>
</html>
